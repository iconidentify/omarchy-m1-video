name: HEVC control adapter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hevc-controls.yml'
      - 'experiments/hevc-controls/**'
      - 'tests/hevc-reftrace-check.py'
  pull_request:
    paths:
      - '.github/workflows/hevc-controls.yml'
      - 'experiments/hevc-controls/**'
      - 'tests/hevc-reftrace-check.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iconidentify/libva-v4l2_request
          ref: ba66572ff7e1e380377eb2414a7eb7d7f97bb0d9
          path: driver-checker
          persist-credentials: false
      - name: Synthetic and pinned driver-checker interoperability tests
        env:
          HEVC_REFTRACE_CHECKER: driver-checker/tests/hevc-reftrace-check.py
        run: python3 experiments/hevc-controls/tests.py
      - name: Published capture consistency and rejection checks (no device)
        env:
          HEVC_REFTRACE_CHECKER: driver-checker/tests/hevc-reftrace-check.py
        run: |
          python3 experiments/hevc-controls/report-tests.py
          python3 experiments/hevc-controls/report.py experiments/hevc-controls/captures/2026-09-17 --verify

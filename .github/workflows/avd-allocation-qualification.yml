name: AVD allocation qualification controller
on:
  push:
    paths:
      - '.github/workflows/avd-allocation-qualification.yml'
      - 'experiments/avd-allocation-qualification/**'
      - 'experiments/hevc-avd-trace/**'
  pull_request:
    paths:
      - '.github/workflows/avd-allocation-qualification.yml'
      - 'experiments/avd-allocation-qualification/**'
      - 'experiments/hevc-avd-trace/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualification-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 experiments/avd-allocation-qualification/tests.py
      - run: python3 experiments/avd-allocation-qualification/report.py
      - run: python3 experiments/avd-allocation-qualification/report-tests.py

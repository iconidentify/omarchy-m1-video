name: AVD allocation retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avd-allocation-retry.yml'
      - 'experiments/avd-allocation-retry/**'
      - 'experiments/hevc-reference-memory/**'
  pull_request:
    paths:
      - '.github/workflows/avd-allocation-retry.yml'
      - 'experiments/avd-allocation-retry/**'
      - 'experiments/hevc-reference-memory/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  allocation-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual allocator and codec-start fault regressions
        env:
          AVD_SANITIZE: '1'
        run: python3 experiments/avd-allocation-retry/tests.py

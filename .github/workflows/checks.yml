name: Checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checks.yml'
      - 'install.sh'
      - 'uninstall.sh'
      - 'bin/**'
      - 'tests/**'
      - 'tools/**'
      - 'libva/**'
      - 'docs/**'
      - 'hooks/**'
      - 'systemd/**'
      - 'experiments/vp9-state/**'
      - 'experiments/h264-profile-selection/**'
      - 'experiments/hevc-avd-controls-map/**'
      - 'experiments/hevc-parameter-sets/**'
  pull_request:
    paths:
      - '.github/workflows/checks.yml'
      - 'install.sh'
      - 'uninstall.sh'
      - 'bin/**'
      - 'tests/**'
      - 'tools/**'
      - 'libva/**'
      - 'docs/**'
      - 'hooks/**'
      - 'systemd/**'
      - 'experiments/vp9-state/**'
      - 'experiments/h264-profile-selection/**'
      - 'experiments/hevc-avd-controls-map/**'
      - 'experiments/hevc-parameter-sets/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh uninstall.sh bin/apple-avd-rebuild tests/rebuild.sh tests/installer.sh libva/PKGBUILD libva/libva-v4l2_request-avd.install tools/reproduce-package.sh
      - run: bash tests/rebuild.sh
      - run: bash tests/installer.sh
      - run: python3 tests/h264-interlace-scan-test.py
      - run: python3 tests/vp9-sub64-scan-test.py
      - run: python3 experiments/vp9-state/validate.py --self-test
      - run: python3 experiments/h264-profile-selection/validate.py --self-test
      - run: python3 experiments/hevc-avd-controls-map/verify-source.py
      - run: python3 experiments/hevc-parameter-sets/tests.py
      - run: python3 tests/qualify-device-test.py
      - run: python3 tests/boot-evidence-test.py
      - run: python3 -m pip install jsonschema==4.25.1
      - run: python3 tests/package-provenance-test.py

name: H.264 client admission
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h264-client-admission.yml'
      - 'experiments/h264-client-admission/**'
  pull_request:
    paths:
      - '.github/workflows/h264-client-admission.yml'
      - 'experiments/h264-client-admission/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install libva headers
        run: sudo apt-get update && sudo apt-get install -y libva-dev pkg-config
      - name: Offline admission tests
        run: python3 experiments/h264-client-admission/tests.py
      - name: Build VAAPI-off and patched VAAPI-on ffmpeg
        run: python3 experiments/h264-client-admission/build.py "$RUNNER_TEMP/h264-admission-build"

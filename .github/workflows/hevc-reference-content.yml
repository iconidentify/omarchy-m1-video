name: HEVC reference content
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hevc-reference-content.yml'
      - 'experiments/hevc-reference-content/**'
      - 'experiments/hevc-reference-memory/**'
  pull_request:
    paths:
      - '.github/workflows/hevc-reference-content.yml'
      - 'experiments/hevc-reference-content/**'
      - 'experiments/hevc-reference-memory/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reference-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fake queue pause/drain/retention and adapter admissions
        run: python3 experiments/hevc-reference-content/tests.py
      - name: Campaign controller plan review and refusal
        run: python3 experiments/hevc-reference-content/campaign/tests.py
  gst-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libglib2.0-dev libglib2.0-dev-bin libgudev-1.0-dev flex bison python3-venv
          python3 -m venv "$RUNNER_TEMP/gst-build-tools"
          "$RUNNER_TEMP/gst-build-tools/bin/pip" install 'meson==1.12.0'
          echo "$RUNNER_TEMP/gst-build-tools/bin" >> "$GITHUB_PATH"
      - name: Complete pinned Gst plugin and observer APIs (no device)
        run: python3 experiments/hevc-reference-content/gst-adapter/tests.py

  copy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        client: [va, gst]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libva-dev libdrm-dev libglib2.0-dev libglib2.0-dev-bin libgudev-1.0-dev flex bison python3-venv
          python3 -m venv "$RUNNER_TEMP/content-build-tools"
          "$RUNNER_TEMP/content-build-tools/bin/pip" install 'meson==1.12.0'
          echo "$RUNNER_TEMP/content-build-tools/bin" >> "$GITHUB_PATH"
      - name: Complete pinned client, retained copies and semantic mutations (no device)
        run: python3 experiments/hevc-reference-content/integration/tests.py --client ${{ matrix.client }} --keep "$RUNNER_TEMP/content-${{ matrix.client }}"

  gst-callsite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libglib2.0-dev libglib2.0-dev-bin libgudev-1.0-dev flex bison python3-venv
          python3 -m venv "$RUNNER_TEMP/callsite-build-tools"
          "$RUNNER_TEMP/callsite-build-tools/bin/pip" install 'meson==1.12.0'
          echo "$RUNNER_TEMP/callsite-build-tools/bin" >> "$GITHUB_PATH"
      - name: Pinned production output callback and cleanup (no device)
        run: python3 experiments/hevc-reference-content/gst-callsite/tests.py --keep "$RUNNER_TEMP/gst-callsite"

  va-callsite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install FFmpeg VA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libva-dev libdrm-dev
      - name: Pinned FFmpeg HEVC output hook, binding and cleanup (no device)
        run: python3 experiments/hevc-reference-content/va-callsite/tests.py --keep "$RUNNER_TEMP/va-callsite"

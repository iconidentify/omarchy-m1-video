name: HEVC VA observer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hevc-va-observer.yml'
      - 'experiments/hevc-reference-content/**'
  pull_request:
    paths:
      - '.github/workflows/hevc-va-observer.yml'
      - 'experiments/hevc-reference-content/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  va-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install driver build dependencies
        run: sudo apt-get update && sudo apt-get install -y libva-dev libdrm-dev pkg-config meson ninja-build
      - name: Full driver build and observer API tests with fake V4L2
        run: python3 experiments/hevc-reference-content/va-adapter/tests.py

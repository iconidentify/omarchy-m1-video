name: HEVC VA observer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  va-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install libva headers
        run: sudo apt-get update && sudo apt-get install -y libva-dev pkg-config
      - name: Actual patched decode.c observer with fake V4L2
        run: python3 experiments/hevc-reference-content/va-adapter/tests.py

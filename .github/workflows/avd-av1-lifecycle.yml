name: AVD AV1 lifecycle
on:
  push:
    paths:
      - '.github/workflows/avd-av1-lifecycle.yml'
      - 'experiments/avd-av1-lifecycle/**'
      - 'experiments/avd-allocation-retry/**'
  pull_request:
    paths:
      - '.github/workflows/avd-av1-lifecycle.yml'
      - 'experiments/avd-av1-lifecycle/**'
      - 'experiments/avd-allocation-retry/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  av1-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extracted AV1 start unwind leak and isolated patch
        run: python3 experiments/avd-av1-lifecycle/tests.py
